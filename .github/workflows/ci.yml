name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: "npm"
          node-version: "25.x"

      - name: Install dependencies
        run: npm ci

      # `biome ci` reports and fails. `npm run check` would rewrite the files
      # instead, which is what you want locally and never what you want here.
      - name: Lint and format
        run: npm run ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
